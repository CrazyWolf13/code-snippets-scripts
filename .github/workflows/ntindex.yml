name: Generate NTINDEX

on:
  push:
    branches: [main]
    paths-ignore: [NTINDEX]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ntindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Folders ending in _ignored (e.g. windows_ignored/) are kept in the repo but not offered in Nexterm
      - name: Build NTINDEX
        run: |
          git ls-files -z -- '*.sh' '*.bash' '*.zsh' '*.fish' '*.ps1' '*.txt' '*.snippet' '*.cmd' '*.theme.css' \
            ':(exclude,glob)**/*_ignored/**' \
            | sort -z \
            | while IFS= read -r -d '' f; do
                printf '%s@%s\n' "$f" "$(sha256sum "$f" | cut -d' ' -f1)"
              done > NTINDEX
          cat NTINDEX

      - name: Commit if changed
        run: |
          git add NTINDEX
          if git diff --cached --quiet; then echo "NTINDEX unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update NTINDEX"
          git push